# ============================================
# SRIMATCH - TEST CONFIGURATION
# ============================================

# Server
server.port=0

# Database - H2 for Testing
spring.datasource.url=jdbc:h2:mem:srimatch_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - Test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway - Test
spring.flyway.enabled=false

# Redis - Embedded
spring.data.redis.repositories.enabled=false

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Mock Services
srimatch.mock.sms.enabled=true
srimatch.mock.email.enabled=true
srimatch.otp.debug-mode=true
srimatch.mock.payments.enabled=true

# File Upload
file.upload-dir=./test-uploads/

# Logging - Test
logging.level.com.srimatch=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Testing properties
spring.main.allow-bean-definition-overriding=true
spring.sql.init.mode=embedded
app.security.verification.key=srimatch-unit-test-secret-key-32chars-min!!