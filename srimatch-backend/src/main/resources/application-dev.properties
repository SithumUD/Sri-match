# ============================================
# SRIMATCH - DEVELOPMENT CONFIGURATION
# ============================================

# Server
server.port=8080
server.servlet.context-path=/api

# Database - PostgreSQL (Development)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:srimatch_dev}
spring.datasource.username=${DB_USERNAME:srimatch_user}
spring.datasource.password=${DB_PASSWORD:srimatch_secret_pwd}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA (Development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10

# Flyway (Development)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.table=flyway_schema_history

# Redis (Development)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Email (Development - Mailtrap)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_mailtrap_username
spring.mail.password=your_mailtrap_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS (Development - Twilio Test)
twilio.account.sid=ACtest_account_sid
twilio.auth.token=test_auth_token
twilio.phone.number=+15017122661

# File Upload
file.upload-dir=./uploads/profiles/
file.allowed-extensions=jpg,jpeg,png,gif
file.max-size=5242880

# CORS (Development)
cors.allowed.origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000
app.security.verification.key=${APP_ENCRYPTION_KEY:srimatch-development-secret-key-32chars-min!!}

# Logging (Development)
logging.level.com.srimatch=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Debug Mode
debug=true

# Dev Tools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Mock Services
srimatch.mock.sms.enabled=true
srimatch.mock.email.enabled=true
srimatch.otp.debug-mode=true