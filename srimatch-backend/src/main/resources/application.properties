# ============================================
# SRIMATCH - BASE APPLICATION CONFIGURATION
# ============================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
server.tomcat.uri-encoding=UTF-8
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=30000
server.tomcat.max-connections=10000
server.tomcat.max-http-post-size=10485760

# Spring Application
spring.application.name=srimatch
spring.profiles.active=dev

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Colombo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Internationalization
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Logging
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true

# ============================================
# SECURITY & JWT CONFIGURATION
# ============================================
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.remember-me.expiration=604800000
application.security.jwt.remember-me.refresh-token.expiration=2592000000
application.security.jwt.cookie-secure=${COOKIE_SECURE:false}

# ============================================
# CLOUDFLARE R2 OBJECT STORAGE (Primary S3 Storage)
# ============================================
cloudflare.r2.enabled=${R2_ENABLED:false}
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:srimatch-media}
cloudflare.r2.public-domain=${R2_PUBLIC_CUSTOM_DOMAIN:https://media.srimatch.lk}

# ============================================
# CLOUDINARY (Fallback Media Storage)
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ============================================
# TRANSACTIONAL EMAIL (BREVO / SMTP)
# ============================================
brevo.api.key=${BREVO_API_KEY:}

# ============================================
# FIREBASE CONFIGURATION
# ============================================
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}


# ============================================
# CLOUDFLARE TURNSTILE CAPTCHA
# ============================================
cloudflare.turnstile.enabled=${CLOUDFLARE_TURNSTILE_ENABLED:false}
cloudflare.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_SECRET_KEY:}

app.security.verification.key=${APP_SECURITY_VERIFICATION_KEY:}

# ============================================
# INITIAL ADMIN USER CONFIGURATION
# ============================================
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@srimatch.lk}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.default-admin.first-name=${DEFAULT_ADMIN_FIRST_NAME:Admin}
app.default-admin.last-name=${DEFAULT_ADMIN_LAST_NAME:SriMatch}