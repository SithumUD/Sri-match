# ============================================
# SRIMATCH - PRODUCTION CONFIGURATION
# ============================================

# Server - Production
server.port=8080
server.servlet.context-path=/api
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000
server.tomcat.max-http-post-size=10485760
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# SSL Configuration (Disabled by default if handled by reverse proxy/load balancer)
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SSL_KEYSTORE_PATH:/etc/ssl/srimatch/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:change_me}
server.ssl.key-alias=srimatch

# Database - Production
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:srimatch_db}
spring.datasource.username=${DB_USERNAME:srimatch_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=SriMatchHikariPool

# JPA - Production
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Flyway - Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.table=flyway_schema_history

# Redis - Production
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# JWT - Production
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-token.expiration=604800000

# Email - Production (SendGrid / Brevo)
spring.mail.host=${SMTP_HOST:smtp.sendgrid.net}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:apikey}
spring.mail.password=${SENDGRID_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# SMS - Production (Twilio)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
twilio.messaging.service.sid=${TWILIO_MESSAGING_SID:}

# File Upload - Production
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads/}
file.allowed-extensions=jpg,jpeg,png,gif,webp
file.max-size=5242880
file.image.compression.enabled=true
file.image.compression.quality=0.8

# CORS - Production
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,https://srimatch.com}

# Logging - Production
logging.level.com.srimatch=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR
logging.file.name=${LOGGING_FILE_NAME:/app/logs/application.log}
logging.file.path=${LOGGING_FILE_PATH:/app/logs}
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=10GB
logging.logback.rollingpolicy.clean-history-on-start=true

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=1ms,5ms,10ms,50ms,100ms,200ms,500ms,1s,2s

# Security
security.require-ssl=${SECURITY_REQUIRE_SSL:false}
security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,https://srimatch.com}
app.security.verification.key=${APP_ENCRYPTION_KEY}

# Payment Gateway - PayHere
payhere.merchant.id=${PAYHERE_MERCHANT_ID:}
payhere.secret=${PAYHERE_SECRET:}
payhere.app.url=${PAYHERE_APP_URL:https://sandbox.payhere.lk}
payhere.return.url=${PAYHERE_RETURN_URL:https://srimatch.com/payment/return}
payhere.cancel.url=${PAYHERE_CANCEL_URL:https://srimatch.com/payment/cancel}
payhere.notify.url=${PAYHERE_NOTIFY_URL:https://api.srimatch.com/api/payments/webhook/payhere}

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=srimatch:cache:

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=srimatch-task-

# Session
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=srimatch:sessions