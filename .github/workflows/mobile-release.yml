name: Mobile App Store Release (EAS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'production'
        type: choice
        options:
          - preview
          - production
      auto_submit:
        description: 'Auto submit to Google Play / App Store'
        required: true
        default: true
        type: boolean

jobs:
  build-and-release:
    name: Build & Submit Mobile App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: srimatch-app/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: |
          cd srimatch-app
          npm ci

      - name: Decode Google Play Service Account (if present)
        if: env.GOOGLE_SERVICES_BASE64 != ''
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > srimatch-app/google-service-account.json

      - name: Run EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd srimatch-app
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          AUTO_SUBMIT="${{ github.event.inputs.auto_submit || 'true' }}"
          
          if [ "$AUTO_SUBMIT" = "true" ] && [ "$PROFILE" = "production" ]; then
            eas build --platform $PLATFORM --profile $PROFILE --auto-submit --non-interactive
          else
            eas build --platform $PLATFORM --profile $PROFILE --non-interactive
          fi
