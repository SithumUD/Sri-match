<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://challenges.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://lh3.googleusercontent.com https://res.cloudinary.com http://res.cloudinary.com; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' ws: wss: http://localhost:* https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self' http://localhost:*; trusted-types *;" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), xr-spatial-tracking=(), interest-cohort=()" />
    
    <script>
      // 🛡️ Console Noise Filter & Trusted Types Polyfill
      (function() {
        // 1. Trusted Types Policy to satisfy Turnstile's internal assignments
        if (window.trustedTypes && window.trustedTypes.createPolicy && !window.trustedTypes.defaultPolicy) {
          try {
            window.trustedTypes.createPolicy('default', {
              createHTML: (string) => string,
              createScript: (string) => string,
              createScriptURL: (string) => string,
            });
          } catch (e) {}
        }

        // 2. Suppress specific noisy error/warn messages from Turnstile & browser probes
        const suppressedPatterns = [
          'TrustedHTML', 'TrustedScript', 'xr-spatial-tracking', 
          'No available adapters', 'Form submission canceled',
          'about:blank', 'about:srcdoc', 'challenges.cloudflare.com'
        ];
        
        const originalError = console.error;
        const originalWarn = console.warn;

        console.error = function(...args) {
          const msg = args.join(' ');
          if (suppressedPatterns.some(p => msg.includes(p))) return;
          originalError.apply(console, args);
        };

        console.warn = function(...args) {
          const msg = args.join(' ');
          if (suppressedPatterns.some(p => msg.includes(p))) return;
          originalWarn.apply(console, args);
        };
      })();
    </script>
    
    <title>srimatch-frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
