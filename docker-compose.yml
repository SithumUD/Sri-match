version: '3.8'

services:
  # ============================================
  # PostgreSQL Database Service
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: srimatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-srimatch_db}
      POSTGRES_USER: ${DB_USERNAME:-srimatch_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-srimatch_secret_pwd}
      TZ: Asia/Colombo
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - srimatch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-srimatch_user} -d ${DB_NAME:-srimatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================
  # Redis Cache & Presence Service
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: srimatch-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT_FORWARD:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - srimatch-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # SriMatch Backend (Spring Boot 3.3.4, Java 21)
  # ============================================
  backend:
    build:
      context: ./srimatch-backend
      dockerfile: Dockerfile
    image: srimatch-backend:latest
    container_name: srimatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-srimatch_db}
      DB_USERNAME: ${DB_USERNAME:-srimatch_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://srimatch.com,https://www.srimatch.com,http://localhost:3000}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - srimatch-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ============================================
  # SriMatch Frontend (React 19 + Nginx)
  # ============================================
  frontend:
    build:
      context: ./srimatch-frontend
      dockerfile: Dockerfile
    image: srimatch-frontend:latest
    container_name: srimatch-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - srimatch-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ============================================
# Networks
# ============================================
networks:
  srimatch-network:
    driver: bridge
    name: srimatch-network

# ============================================
# Persistent Volumes
# ============================================
volumes:
  postgres_data:
    name: srimatch_postgres_data
  redis_data:
    name: srimatch_redis_data
  backend_uploads:
    name: srimatch_backend_uploads
  backend_logs:
    name: srimatch_backend_logs
